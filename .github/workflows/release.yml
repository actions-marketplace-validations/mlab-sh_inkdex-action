name: release

# Push a version tag (`git tag -a v1.2.0 -m "…" && git push origin v1.2.0`): this moves the major
# tag (`v1`) onto it, so `uses: mlab-sh/inkdex-action@v1` follows, and creates the GitHub release
# with notes generated from the commits since the previous one.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # pushes the major tag

      - name: Move the major tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          major="${VERSION%%.*}"
          # an older line's patch (v1.0.5 after v1.2.0) must not pull the major tag back
          latest="$(git tag -l "$major.*.*" --sort=-v:refname | head -1)"
          if [ "$latest" != "$VERSION" ]; then
            echo "$VERSION is not the latest $major.x.y ($latest is): $major stays"
            exit 0
          fi
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
          echo "$major now points at $VERSION"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists"
          else
            gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION"
          fi
